name: Monitor Incendios NASA FIRMS

on:
  schedule:
    # Corre cada 3 horas
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: monitor-incendios
  cancel-in-progress: false

jobs:
  monitor-incendios:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar archivo usado
        run: |
          echo "Archivos en raíz:"
          ls -lah
          echo ""
          echo "Primeras líneas de monitor_incendios.py:"
          head -n 35 monitor_incendios.py

      - name: Ejecutar monitor de incendios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u monitor_incendios.py
