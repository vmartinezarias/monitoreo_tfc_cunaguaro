name: Reporte Mensual Suscriptores

on:
  # Mensual permanente: 1ro de cada mes, 5:00 AM Colombia
  schedule:
    - cron: '0 10 1 * *'

  # Botón manual para ejecutar cuando quieras
  workflow_dispatch:

  # ╔══════════════════════════════════════════════════════════════╗
  # ║  INTERRUPTOR TEMPORAL                                        ║
  # ║  Quita los # de las 2 líneas de abajo para que se ejecute    ║
  # ║  automáticamente al hacer push a main.                       ║
  # ║  Después de probar, vuelve a ponerlos.                       ║
  # ╚══════════════════════════════════════════════════════════════╝
   push:
     branches: [main]

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar reporte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # MODO_PRUEBA: "true"      # ← Descomenta para NO enviar emails, solo generar archivos
          # FORZAR_MES: "2026-08"    # ← Descomenta para probar agosto en vez del mes anterior
          GITHUB_RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main/"
        run: python reporte_suscripciones.py

      - name: Subir reportes como artifacts
        if: always()  # ← Se ejecuta aunque falle el paso anterior
        uses: actions/upload-artifact@v4
        with:
          name: reportes-generados
          path: reportes/
          retention-days: 5
