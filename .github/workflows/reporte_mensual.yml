name: Reporte Mensual Suscriptores

on:
  # Mensual permanente: 1ro de cada mes, 5:00 AM Colombia (10:00 UTC)
  schedule:
    - cron: '0 10 1 * *'

    # ── Disparo único para HOY 2026-09-03 a las 16:10 Colombia (21:10 UTC) ──
    # Colombia = UTC-5 todo el año (sin horario de verano).
    # IMPORTANTE: borra esta línea después de hoy, o se repetirá cada
    # 3 de septiembre de los próximos años.
    - cron: '20 17 6 9 *'

  # Botón manual: puedes elegir modo prueba y archivo de suscriptores
  # sin tocar código. Ve a Actions → Reporte Mensual Suscriptores → Run workflow.
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: "Modo prueba (true = NO envía correos reales)"
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      archivo_suscriptores:
        description: "Archivo CSV a usar"
        type: choice
        default: 'suscriptores.csv'
        options:
          - 'suscriptores.csv'
          - 'suscriptores_PRUEBA.csv'

  # NOTA: el disparador por "push" queda desactivado a propósito.
  # push:
  #   branches: [main]

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install matplotlib

      - name: Ejecutar reporte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          # Disparo manual (botón): usa lo que elijas en el desplegable (por defecto 'true', seguro).
          # Disparo automático (cron, incluida la corrida de hoy): 'false' → envío real,
          # que es justamente el propósito del cron.
          MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.modo_prueba || 'false' }}
          SUSCRIPTORES_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.archivo_suscriptores || 'suscriptores.csv' }}
          # FORZAR_MES: "2026-08"    # ← Descomenta para probar un mes específico
          GITHUB_RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main/"
        run: python reporte_suscripciones.py

      - name: Subir reportes como artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-generados
          path: reportes/
          retention-days: 5
