name: Reporte Mensual Suscriptores

on:
  # Mensual permanente: 1ro de cada mes, 5:00 AM Colombia (10:00 UTC).
  # Reporta el mes ANTERIOR completo (ej. el 1 de noviembre envía octubre).
  # Nota: GitHub puede retrasar los cron unos minutos (a veces más) en horas de alta demanda.
  schedule:
    - cron: '0 10 1 * *'

  # Botón manual: Actions → Reporte Mensual Suscriptores → Run workflow.
  # Sirve para pruebas y para reenvíos puntuales sin tocar código.
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: "Modo prueba (true = NO envía correos reales)"
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      archivo_suscriptores:
        description: "Archivo CSV a usar"
        type: choice
        default: 'suscriptores.csv'
        options:
          - 'suscriptores.csv'
          - 'suscriptores_PRUEBA.csv'
      mes:
        description: "Mes a reportar (AAAA-MM). Vacío = mes anterior al actual"
        type: string
        required: false
        default: ''

  # NOTA: el disparador por "push" queda desactivado a propósito.
  # push:
  #   branches: [main]

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install matplotlib requests

      - name: Ejecutar reporte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          # Opcional: key de GFW dedicada para el envío por correo (servidor-a-servidor).
          # Si no se define este secreto, el script usa la key del visor web como respaldo.
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          # Disparo manual (botón): usa lo que elijas en el desplegable (por defecto 'true', seguro).
          # Disparo automático (cron): 'false' → envío real, que es el propósito del cron.
          MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.modo_prueba || 'false' }}
          SUSCRIPTORES_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.archivo_suscriptores || 'suscriptores.csv' }}
          # Solo en disparo manual y si se llena el campo; el cron siempre usa el mes anterior.
          FORZAR_MES: ${{ github.event_name == 'workflow_dispatch' && inputs.mes || '' }}
          GITHUB_RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main/"
        run: python reporte_suscripciones.py

      - name: Subir reportes como artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-generados
          path: reportes/
          retention-days: 5
