name: Reporte Mensual Suscriptores

on:
  schedule:
    # Temporal: hoy 6 ago 2026 a las 13:47 UTC = 8:47 AM Colombia
    - cron: '47 13 6 8 *'
    # Mensual permanente: 1ro de cada mes a las 10:00 UTC = 5:00 AM Colombia
    - cron: '0 10 1 * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar reporte mensual
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main/"
        run: python reporte_suscripciones.py
