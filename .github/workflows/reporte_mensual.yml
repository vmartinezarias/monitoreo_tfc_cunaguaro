name: Reporte Mensual Suscriptores

on:
  # Mensual permanente: 1ro de cada mes, 5:00 AM Colombia
  schedule:
    - cron: '0 10 1 * *'

  # Botón manual: puedes elegir modo prueba y archivo de suscriptores
  # sin tocar código. Ve a Actions → Reporte Mensual Suscriptores → Run workflow.
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: "Modo prueba (no envía correos reales si es true)"
        type: boolean
        default: true
      archivo_suscriptores:
        description: "Archivo CSV a usar"
        type: choice
        default: 'suscriptores.csv'
        options:
          - 'suscriptores.csv'
          - 'suscriptores_PRUEBA.csv'

  # NOTA: el disparador por "push" queda desactivado a propósito.
  # Ya no es necesario: usa el botón "Run workflow" de arriba para probar.
  # push:
  #   branches: [main]

jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar reporte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}   # vacío = usa onboarding@resend.dev (sandbox)
          MODO_PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.modo_prueba || 'true' }}
          SUSCRIPTORES_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.archivo_suscriptores || 'suscriptores.csv' }}
          # FORZAR_MES: "2026-08"    # ← Descomenta para probar un mes específico
          GITHUB_RAW_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main/"
        run: python reporte_suscripciones.py

      - name: Subir reportes como artifacts
        if: always()  # ← Se ejecuta aunque falle el paso anterior
        uses: actions/upload-artifact@v4
        with:
          name: reportes-generados
          path: reportes/
          retention-days: 5
