<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuna · Asistente CBC Cunaguaro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --verde: #1a4a2e; --verde-m: #2d7a4f; --verde-l: #4caf7d; }
    body { font-family: 'Inter', sans-serif; }
    .syne { font-family: 'Syne', sans-serif; }
    .cuna-detail-text b { color: var(--verde); font-weight: 600; }
    .cuna-detail-text b.gfw { color: #0096b4; }
    @keyframes cunaIn { from{opacity:0;transform:scale(.88) translateY(12px)} to{opacity:1;transform:none} }
    .cuna-in { animation: cunaIn .28s cubic-bezier(.34,1.56,.64,1); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-[2rem] w-full max-w-2xl overflow-hidden shadow-2xl border border-slate-100 cuna-in">

  <!-- Header -->
  <div class="bg-emerald-600 p-5 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-white/20 overflow-hidden border-2 border-white/30 flex-shrink-0">
        <img id="cuna-avatar" src="Cunaguito1.png" alt="Kuna" class="w-full h-full object-cover transition-opacity duration-300">
      </div>
      <div>
        <h3 class="font-extrabold text-xl text-white syne leading-none">Kuna</h3>
        <p class="text-[9px] font-bold text-emerald-200 uppercase tracking-widest mt-1">Asistente · CBC Cunaguaro</p>
      </div>
    </div>
    <a href="index.html"
       class="hover:bg-white/10 p-2 rounded-full transition-colors text-white/80 hover:text-white text-xl leading-none"
       title="Volver al mapa">✕</a>
  </div>

  <!-- Body -->
  <div class="p-6">
    <p id="cuna-msg" class="text-slate-600 text-sm leading-relaxed font-medium mb-5">
      ¡Hola! Soy Kuna. Estoy aquí para guiarte en el manejo del aplicativo. ¿Qué quieres hacer?
    </p>

    <!-- Menú principal -->
    <div id="cuna-menu" class="flex flex-col gap-4">
      <div onclick="cunaIr('sobre')"
           class="flex items-center gap-4 p-5 rounded-2xl border-2 border-emerald-200 bg-emerald-50 hover:bg-emerald-100 cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-lg">
        <span class="text-4xl">🌳</span>
        <div>
          <div class="text-base font-extrabold text-slate-800 syne">Sobre la plataforma</div>
          <div class="text-[11px] text-slate-500 mt-0.5">¿Qué hace? · ¿En qué estamos ahora?</div>
        </div>
        <span class="ml-auto text-emerald-400 text-xl">›</span>
      </div>
      <div onclick="cunaIr('funcionalidades')"
           class="flex items-center gap-4 p-5 rounded-2xl border-2 border-violet-200 bg-violet-50 hover:bg-violet-100 cursor-pointer transition-all hover:-translate-y-0.5 hover:shadow-lg">
        <span class="text-4xl">📖</span>
        <div>
          <div class="text-base font-extrabold text-slate-800 syne">Funcionalidades</div>
          <div class="text-[11px] text-slate-500 mt-0.5">Guía de uso · capas · datos</div>
        </div>
        <span class="ml-auto text-violet-400 text-xl">›</span>
      </div>
    </div>

    <!-- Detalle (oculto por defecto) -->
    <div id="cuna-detail" class="hidden flex-col gap-0">
      <img id="cuna-detail-img" class="w-full h-44 object-cover rounded-xl mb-4 border border-slate-100" src="" alt="">
      <div id="cuna-detail-text" class="text-sm text-slate-600 leading-relaxed cuna-detail-text"></div>
      <button onclick="cunaVolver()"
              class="mt-5 w-full py-3 border-2 border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 transition-all">
        ← Volver al menú
      </button>
    </div>
  </div>

</div><!-- /card -->

<script>
// ── Datos Kuna ────────────────────────────────────────────────────────────────
const CUNA_DATOS = {
  sobre: {
    img: null,
    esMulti: true,
    slides: [
      { titulo: '¿Qué hace la plataforma?', img: 'kuna_workflow.png' },
      { titulo: '¿En qué estamos ahora?',   img: 'kuna_workflow_estado.png' }
    ]
  },
  funcionalidades: {
    img: null,
    esMulti: true,
    slides: [
      {
        titulo: 'Cambiar el mapa base',
        img: 'mapabase.png',
        kunaImg: 'kuna_senala.png',
        texto: `Usa el control de capas en la <b>esquina inferior derecha</b> del mapa. Tienes 5 opciones: <b>CartoDB Claro</b> (predeterminado), <b>Google Maps</b>, <b>Satélite</b>, <b>Relieve</b> y <b>Oscuro</b>. Cambia según la mejor visualización para tu análisis.`
      },
      {
        titulo: 'Global Forest Watch — GLAD & RADD',
        img: 'gfw_incon.png',
        kunaImg: 'kuna_saludando.png',
        texto: `<b class="gfw">Global Forest Watch</b> (WRI) provee alertas satelitales de deforestación casi en tiempo real.<br><br>🌲 <b>GLAD</b> — Landsat · Universidad de Maryland · detección semanal<br>📡 <b>RADD</b> — Sentinel-1 SAR · Univ. Wageningen · funciona bajo nubes<br><br>Créditos: © Global Forest Watch / World Resources Institute. Datos bajo licencia CC BY 4.0.`
      },
      {
        titulo: 'Alertas de Incendios — NASA FIRMS',
        img: 'incendios.png',
        kunaImg: 'kuna_senala.png',
        texto: `Los puntos de calor provienen de <b>NASA FIRMS</b> (Fire Information for Resource Management System), usando sensores <b>VIIRS</b> (375 m) y <b>MODIS</b> (1 km) actualizados cada 3 horas.<br><br>Cada punto muestra: coordenadas, nivel de confianza (Alta / Nominal / Baja) y potencia radiativa del fuego (<b>FRP en MW</b>).`
      },
      {
        titulo: 'Capas Adicionales',
        img: 'capas_adicionales.png',
        kunaImg: 'kuna_saludando.png',
        texto: `En <b>Capas adicionales</b> (panel izquierdo) puedes activar:<br><br>📍 <b>Límites municipales</b> — contornos administrativos<br>📐 <b>Área de estudio</b> — polígono de monitoreo CBC Cunaguaro<br>🌲 <b>Núcleos boscosos</b> — fragmentos prioritarios<br>📉 <b>Pérdidas 2020-2024</b> — pérdida forestal por año<br>🔗 <b>Conectividad</b> — modelo de deciles de importancia ecológica<br>🌿 <b>Alertas deforestación GEE</b> — basado en cambio NDVI Sentinel-2`
      }
    ]
  }
};

// ── Lógica de slides ──────────────────────────────────────────────────────────
let _slideIdx = 0;
let _slideKey = null;

function cunaIr(key) {
  const d = CUNA_DATOS[key];
  if (!d) return;

  const avatar = document.getElementById('cuna-avatar');
  avatar.style.opacity = '0';
  setTimeout(() => { avatar.src = 'kuna_saludando.png'; avatar.style.opacity = '1'; }, 150);

  const menu   = document.getElementById('cuna-menu');
  const detail = document.getElementById('cuna-detail');

  menu.style.opacity = '0';
  setTimeout(() => {
    menu.classList.add('hidden');
    detail.innerHTML = '';
    detail.classList.remove('hidden');
    detail.classList.add('flex');

    if (d.esMulti) {
      _slideKey = key;
      detail.innerHTML = renderMulti();
      cunaSlide(0, d);
    } else {
      detail.innerHTML = `
        <img id="cuna-detail-img" class="w-full h-44 object-cover rounded-xl mb-4 border border-slate-100" src="${d.img||''}" alt="">
        <div id="cuna-detail-text" class="text-sm text-slate-600 leading-relaxed cuna-detail-text">${d.msg||''}</div>
        <button onclick="cunaVolver()" class="mt-5 w-full py-3 border-2 border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 transition-all">← Volver al menú</button>`;
    }
    detail.style.opacity = '0';
    setTimeout(() => { detail.style.opacity = '1'; }, 20);
  }, 180);
}

function renderMulti() {
  return `
    <div class="flex items-center justify-between mb-3 w-full">
      <div class="text-[9px] font-bold text-slate-400 uppercase tracking-widest" id="kuna-slide-label">Cargando…</div>
      <div class="flex gap-1" id="kuna-dots"></div>
    </div>
    <div id="kuna-slide-content" class="flex flex-col gap-3 w-full"></div>
    <div class="flex gap-2 mt-4 w-full">
      <button onclick="cunaSlideNav(-1)" id="btn-prev"
              class="flex-1 py-2.5 border-2 border-slate-200 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50 transition-all">← Anterior</button>
      <button onclick="cunaSlideNav(1)" id="btn-next"
              class="flex-1 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold hover:bg-emerald-700 transition-all">Siguiente →</button>
    </div>
    <button onclick="cunaVolver()"
            class="mt-2 w-full py-2.5 border-2 border-slate-100 rounded-xl text-[10px] font-bold text-slate-400 hover:bg-slate-50 transition-all">← Volver al menú</button>`;
}

function cunaSlide(idx, d) {
  if (!d) return;
  const slides = d.slides || [];
  _slideIdx = Math.max(0, Math.min(idx, slides.length - 1));
  const s = slides[_slideIdx];
  if (!s) return;

  const lbl = document.getElementById('kuna-slide-label');
  if (lbl) lbl.textContent = s.titulo;

  const dots = document.getElementById('kuna-dots');
  if (dots) {
    dots.innerHTML = slides.map((_, i) =>
      `<div class="w-1.5 h-1.5 rounded-full transition-all ${i === _slideIdx ? 'bg-emerald-600' : 'bg-slate-200'}"></div>`
    ).join('');
  }

  const cont = document.getElementById('kuna-slide-content');
  if (cont) {
    if (!s.kunaImg && !s.texto) {
      cont.innerHTML = `<img src="${s.img}" alt="${s.titulo}"
        class="w-full rounded-xl border border-slate-100 shadow-md"
        style="width:100%;object-fit:contain;background:#f8faf9;display:block">`;
    } else {
      cont.innerHTML = `
        <div class="flex items-start gap-3">
          <img src="${s.kunaImg || 'kuna_saludando.png'}" alt="Kuna"
               class="w-14 h-14 rounded-xl object-cover shrink-0 border border-emerald-100">
          <div class="text-sm font-semibold text-slate-700 leading-relaxed">${s.texto || ''}</div>
        </div>
        <img src="${s.img}" alt="${s.titulo}"
             class="w-full rounded-xl border border-slate-100 shadow-sm"
             style="max-height:200px;object-fit:contain;background:#f8faf9">`;
    }
  }

  const prev = document.getElementById('btn-prev');
  const next = document.getElementById('btn-next');
  if (prev) prev.style.visibility = _slideIdx === 0 ? 'hidden' : 'visible';
  if (next) {
    next.textContent = _slideIdx === slides.length - 1 ? '✓ Listo' : 'Siguiente →';
    next.onclick = _slideIdx === slides.length - 1 ? cunaVolver : () => cunaSlideNav(1);
  }
}

function cunaSlideNav(dir) {
  if (!_slideKey) return;
  const d = CUNA_DATOS[_slideKey];
  if (!d || !d.slides) return;
  const ni = _slideIdx + dir;
  if (ni >= 0 && ni < d.slides.length) cunaSlide(ni, d);
}

function cunaVolver() {
  const avatar = document.getElementById('cuna-avatar');
  avatar.style.opacity = '0';
  setTimeout(() => { avatar.src = 'Cunaguito1.png'; avatar.style.opacity = '1'; }, 150);

  const msg = document.getElementById('cuna-msg');
  msg.style.opacity = '0';
  setTimeout(() => {
    msg.textContent = '¡Hola! Soy Kuna. Estoy aquí para guiarte en el manejo del aplicativo. ¿Qué quieres hacer?';
    msg.style.opacity = '1';
  }, 150);

  const menu   = document.getElementById('cuna-menu');
  const detail = document.getElementById('cuna-detail');
  detail.style.opacity = '0';
  setTimeout(() => {
    detail.classList.add('hidden');
    detail.classList.remove('flex');
    menu.classList.remove('hidden');
    menu.style.opacity = '0';
    setTimeout(() => { menu.style.opacity = '1'; }, 20);
  }, 180);
}
</script>
</body>
</html>
